<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>PiDeck 插件</title>
		<meta name="description" content="PiDeck 宿主插件的收录表，以及 GitHub 上所有打了 pideck-plugin topic 的第三方插件。" />
		<style>
			:root {
				--paper: #ffffff;
				--ink: #1a1917;
				--muted: #6b6862;
				--faint: #75726b;
				--rule: #e5e2db;
				--rule-strong: #cfcbc2;
				--wash: #f8f6f2;
				--accent: #1d3f66;
				--warn: #8a5200;
				--ok: #2f6b45;
				--sel: #e8e3d8;
				--font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
				--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				color-scheme: light;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--paper: #121211;
					--ink: #ece9e3;
					--muted: #a29e96;
					--faint: #857f77;
					--rule: #2b2a27;
					--rule-strong: #413f3a;
					--wash: #191917;
					--accent: #93b6d9;
					--warn: #d3a05a;
					--ok: #7fbb96;
					--sel: #33312c;
					color-scheme: dark;
				}
			}
			* {
				box-sizing: border-box;
			}
			[hidden] {
				display: none !important;
			}
			html {
				background: var(--paper);
			}
			body {
				margin: 0;
				background: var(--paper);
				color: var(--ink);
				font: 14px/1.6 var(--font);
				-webkit-font-smoothing: antialiased;
				caret-color: var(--accent);
			}
			::selection {
				background: var(--sel);
			}
			* {
				scrollbar-width: thin;
				scrollbar-color: var(--rule-strong) transparent;
			}
			a {
				color: var(--accent);
				text-decoration-color: color-mix(in oklab, var(--accent) 32%, transparent);
				text-underline-offset: 3px;
			}
			a:hover {
				text-decoration-color: currentColor;
			}
			button {
				font: inherit;
				color: inherit;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
				border-radius: 2px;
			}

			.shell {
				display: grid;
				grid-template-columns: 236px minmax(0, 1fr);
				max-width: 1300px;
				margin: 0 auto;
				padding: 0 32px;
			}

			/* ---- rail ---- */
			.rail {
				position: sticky;
				top: 0;
				align-self: start;
				height: 100vh;
				overflow-y: auto;
				padding: 32px 26px 28px 0;
				border-right: 1px solid var(--rule);
			}
			.brand {
				margin: 0;
				font-size: 18px;
				font-weight: 650;
				letter-spacing: -0.015em;
			}
			.brand-sub {
				margin: 6px 0 0;
				font-size: 12.5px;
				line-height: 1.65;
				color: var(--muted);
			}
			.rail h2 {
				margin: 26px 0 8px;
				font-size: 12.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				color: var(--faint);
			}
			.filters {
				display: flex;
				flex-direction: column;
				gap: 1px;
			}
			.filters button {
				display: flex;
				align-items: baseline;
				gap: 8px;
				width: 100%;
				padding: 5px 0 5px 14px;
				border: 0;
				background: none;
				color: var(--muted);
				font-size: 13.5px;
				text-align: left;
				cursor: pointer;
				position: relative;
			}
			.filters button::before {
				content: "";
				position: absolute;
				left: 0;
				top: 11px;
				width: 5px;
				height: 5px;
				background: currentColor;
				opacity: 0;
			}
			.filters button:hover {
				color: var(--ink);
			}
			.filters button[aria-pressed="true"] {
				color: var(--ink);
				font-weight: 600;
			}
			.filters button[aria-pressed="true"]::before {
				opacity: 1;
			}
			.filters .n {
				margin-left: auto;
				font-family: var(--mono);
				font-size: 11.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
			}
			.steps {
				margin: 0;
				padding: 0;
				list-style: none;
				counter-reset: s;
				font-size: 12.5px;
				line-height: 1.7;
				color: var(--muted);
			}
			.steps li {
				position: relative;
				padding-left: 17px;
			}
			.steps li + li {
				margin-top: 5px;
			}
			.steps li::before {
				counter-increment: s;
				content: counter(s) ".";
				position: absolute;
				left: 0;
				color: var(--faint);
				font-family: var(--mono);
				font-size: 11px;
			}
			.rail-mobile-note {
				display: none;
			}
			.rail-foot {
				margin-top: 26px;
				padding-top: 14px;
				border-top: 1px solid var(--rule);
				font-size: 12.5px;
				line-height: 1.9;
				color: var(--muted);
			}
			.rail-foot a {
				display: block;
			}

			/* ---- main ---- */
			main {
				padding: 0 0 80px 40px;
				min-width: 0;
			}
			.search {
				position: sticky;
				top: 0;
				z-index: 5;
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 26px 0 12px;
				background: var(--paper);
				border-bottom: 1px solid var(--rule);
			}
			.search input {
				flex: 1 1 auto;
				min-width: 0;
				height: 30px;
				padding: 0;
				border: 0;
				background: none;
				color: inherit;
				font: inherit;
				font-size: 15px;
				appearance: none;
			}
			.search input::placeholder {
				color: var(--muted);
			}
			.search input::-webkit-search-cancel-button {
				appearance: none;
			}
			.search kbd {
				font-family: var(--mono);
				font-size: 11px;
				color: var(--faint);
				border: 1px solid var(--rule);
				border-radius: 3px;
				padding: 1px 5px;
			}
			.search:focus-within kbd {
				opacity: 0;
			}
			.search:focus-within {
				border-bottom-color: var(--ink);
			}
			.status {
				margin: 14px 0 0;
				font-size: 12.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
			}
			.notice {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 10px;
				margin-top: 12px;
				padding: 8px 0 8px 12px;
				border-left: 2px solid var(--warn);
				font-size: 13px;
				color: var(--muted);
			}
			.notice strong {
				color: var(--warn);
				font-weight: 600;
			}
			.notice button {
				border: 0;
				background: none;
				padding: 0;
				color: var(--accent);
				font-size: 13px;
				text-decoration: underline;
				text-underline-offset: 3px;
				cursor: pointer;
			}

			/* ---- groups ---- */
			.group {
				margin-top: 34px;
			}
			.group-head {
				display: flex;
				align-items: baseline;
				gap: 10px;
				padding-bottom: 8px;
			}
			.group-head h2 {
				margin: 0;
				font-size: 14px;
				font-weight: 650;
				letter-spacing: -0.005em;
			}
			.group-note {
				font-size: 12.5px;
				color: var(--faint);
			}
			.group-note[data-warn] {
				color: var(--warn);
			}
			.group-count {
				margin-left: auto;
				font-family: var(--mono);
				font-size: 11.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
			}
			.entries {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				column-gap: 48px;
			}
			.entry {
				padding: 14px 0 13px;
				border-top: 1px solid var(--rule);
				min-width: 0;
			}
			.e-head {
				display: flex;
				align-items: baseline;
				gap: 9px;
			}
			.e-head svg {
				flex: none;
				width: 15px;
				height: 15px;
				color: var(--faint);
				transform: translateY(2px);
			}
			.e-name {
				color: var(--ink);
				font-size: 15.5px;
				font-weight: 600;
				letter-spacing: -0.008em;
				text-decoration: none;
				overflow-wrap: anywhere;
			}
			.e-name:hover {
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			.e-ver {
				margin-left: auto;
				flex: none;
				font-family: var(--mono);
				font-size: 11.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
			}
			.e-desc {
				max-width: 58ch;
				margin: 5px 0 0;
				font-size: 13px;
				line-height: 1.6;
				color: var(--muted);
			}
			.e-foot {
				display: flex;
				align-items: baseline;
				gap: 12px;
				margin-top: 7px;
				font-size: 12px;
			}
			.e-perm {
				color: var(--faint);
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.e-kind {
				flex: none;
				color: var(--faint);
			}
			.e-copy {
				margin-left: auto;
				flex: none;
				padding: 0;
				border: 0;
				background: none;
				color: var(--accent);
				font-size: 12px;
				text-decoration: none;
				cursor: pointer;
			}
			.e-copy:hover {
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			.e-copy[data-state="done"] {
				color: var(--ok);
			}
			.e-copy[data-state="failed"] {
				color: var(--warn);
			}

			/* ---- states ---- */
			.empty {
				margin-top: 34px;
				padding: 40px 0;
				border-top: 1px solid var(--rule);
				border-bottom: 1px solid var(--rule);
			}
			.empty h2 {
				margin: 0;
				font-size: 15px;
				font-weight: 600;
			}
			.empty p {
				margin: 6px 0 0;
				font-size: 13px;
				color: var(--muted);
			}
			.empty .acts {
				display: flex;
				gap: 16px;
				margin-top: 12px;
			}
			.empty .acts button {
				padding: 0;
				border: 0;
				background: none;
				color: var(--accent);
				font-size: 13px;
				text-decoration: underline;
				text-underline-offset: 3px;
				cursor: pointer;
			}
			.sk {
				height: 9px;
				background: var(--wash);
				border-radius: 2px;
			}
			.skeleton .sk {
				animation: fade 1.6s ease-in-out infinite;
			}
			@keyframes fade {
				50% {
					opacity: 0.45;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.skeleton .sk {
					animation: none;
				}
			}

			@media (max-width: 900px) {
				.shell {
					grid-template-columns: minmax(0, 1fr);
					padding: 0 20px;
				}
				.rail {
					position: static;
					height: auto;
					overflow: visible;
					padding: 26px 0 18px;
					border-right: 0;
					border-bottom: 1px solid var(--rule);
				}
				.filters {
					flex-direction: row;
					gap: 18px;
					margin-top: 12px;
				}
				.filters button {
					width: auto;
					padding: 0;
				}
				.filters button::before {
					display: none;
				}
				.filters button[aria-pressed="true"] {
					text-decoration: underline;
					text-underline-offset: 4px;
				}
				.filters .n {
					margin-left: 4px;
				}
				.rail .steps-wrap {
					display: none;
				}
				.rail-mobile-note {
					display: block;
					margin: 14px 0 0;
					font-size: 12.5px;
					line-height: 1.7;
					color: var(--muted);
				}
				.rail-foot {
					margin-top: 14px;
					padding-top: 12px;
				}
				.rail-foot a {
					display: inline;
					margin-right: 16px;
				}
				main {
					padding: 0 0 64px;
				}
				.search {
					padding-top: 18px;
				}
				.entries {
					grid-template-columns: minmax(0, 1fr);
				}
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<aside class="rail">
				<h1 class="brand">PiDeck 插件</h1>
				<p class="brand-sub">官方收录由本仓库维护，人工核对过 manifest 与权限。社区条目抓自 GitHub topic，<strong>没有人审阅过</strong>。</p>

				<h2>来源</h2>
				<nav class="filters" aria-label="来源">
					<button type="button" data-source="all" aria-pressed="true">全部<span class="n" data-count="all">0</span></button>
					<button type="button" data-source="registry" aria-pressed="false">官方收录<span class="n" data-count="registry">0</span></button>
					<button type="button" data-source="github" aria-pressed="false">社区<span class="n" data-count="github">0</span></button>
				</nav>

				<div class="steps-wrap">
					<h2>怎么装</h2>
					<ol class="steps">
						<li>在 PiDeck 打开「设置 → 插件 → 安装插件 → 从 GitHub 链接…」，粘贴复制到的链接。</li>
						<li>安装只把源码包放进去，不执行仓库里的脚本，也不跑构建。</li>
						<li>装完是禁用状态，确认权限后才启用。</li>
					</ol>
				</div>

				<p class="rail-mobile-note">装法：设置 → 插件 → 安装插件 → 从 GitHub 链接…，装完仍是禁用状态，确认权限后才启用。</p>

				<div class="rail-foot">
					<a href="https://github.com/ayuayue/pideck-plugins">提 PR 收录</a>
					<a href="https://github.com/ayuayue/PiDeck/blob/main/docs/host-plugin-dev-guide.md">插件开发文档</a>
				</div>
			</aside>

			<main>
				<div class="search">
					<input id="query" type="search" placeholder="搜索插件、作者或标签" autocomplete="off" aria-label="搜索插件" />
					<kbd aria-hidden="true">/</kbd>
				</div>

				<p id="status" class="status" role="status" aria-live="polite">加载中…</p>
				<div id="notice" class="notice" hidden></div>

				<div id="results"></div>

				<div id="empty" class="empty" hidden>
					<h2 id="empty-title">没有匹配的插件</h2>
					<p id="empty-hint">换个关键词，或者切回全部来源看看。</p>
					<div class="acts">
						<button type="button" id="clear">清除搜索</button>
						<button type="button" id="show-all">看全部</button>
					</div>
				</div>
			</main>
		</div>

		<script type="module">
			const REGISTRY_URL = "./registry.json";
			const TOPIC = "pideck-plugin";
			const CACHE_KEY = "pideck-plugins-github-cache";
			const CACHE_TTL_MS = 10 * 60 * 1000;
			const MANIFEST_FILE = "pideck-plugin.json";

			const el = (id) => document.getElementById(id);
			const state = { registry: [], github: [], source: "all", query: "", errors: [], loading: true };

			const installUrl = (entry) => (entry.subpath ? `https://github.com/${entry.repo}/tree/${entry.ref ?? "main"}/${entry.subpath}` : `https://github.com/${entry.repo}`);

			const KINDS = { page: "页面", popover: "浮层", modal: "弹窗" };

			const ICONS = {
				activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
				"file-text": '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
				layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
				"bar-chart": '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
				box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
			};

			const mark = (name) => {
				const node = document.createElementNS("http://www.w3.org/2000/svg", "svg");
				node.setAttribute("viewBox", "0 0 24 24");
				node.setAttribute("fill", "none");
				node.setAttribute("stroke", "currentColor");
				node.setAttribute("stroke-width", "1.5");
				node.setAttribute("stroke-linecap", "round");
				node.setAttribute("stroke-linejoin", "round");
				node.setAttribute("aria-hidden", "true");
				node.innerHTML = ICONS[name] ?? ICONS.box;
				return node;
			};

			function loadRegistry() {
				return fetch(REGISTRY_URL).then((response) => {
					if (!response.ok) throw new Error(`registry.json HTTP ${response.status}`);
					return response.json();
				});
			}

			async function loadGitHub() {
				try {
					const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) ?? "null");
					if (cached && Date.now() - cached.at < CACHE_TTL_MS) return cached.entries;
				} catch {
					/* 缓存坏了就重新拉 */
				}
				const response = await fetch(`https://api.github.com/search/repositories?q=topic:${TOPIC}&sort=stars&order=desc&per_page=30`, {
					headers: { Accept: "application/vnd.github+json" },
				});
				if (!response.ok) throw new Error(`GitHub HTTP ${response.status}${response.status === 403 ? "（未认证限额，等一分钟再试）" : ""}`);
				const payload = await response.json();
				const repos = (payload.items ?? []).filter((item) => !item.fork && !item.archived);
				const entries = [];
				for (const repo of repos) {
					// 社区源只认仓库根的 manifest；单仓库多插件走 registry 的 subpath。
					try {
						const manifestResponse = await fetch(`https://raw.githubusercontent.com/${repo.full_name}/${repo.default_branch}/${MANIFEST_FILE}`);
						if (!manifestResponse.ok) continue;
						const manifest = await manifestResponse.json();
						if (typeof manifest?.id !== "string") continue;
						entries.push({
							id: manifest.id,
							name: manifest.name ?? repo.name,
							version: manifest.version,
							description: manifest.description ?? repo.description,
							permissions: Array.isArray(manifest.permissions) ? manifest.permissions : [],
							presentations: Array.isArray(manifest.presentations) ? manifest.presentations : [],
							repo: repo.full_name,
							stars: repo.stargazers_count,
							author: repo.owner?.login,
							license: repo.license?.spdx_id && repo.license.spdx_id !== "NOASSERTION" ? repo.license.spdx_id : undefined,
							subpath: "",
							source: "github",
						});
					} catch {
						continue;
					}
				}
				try {
					sessionStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), entries }));
				} catch {
					/* 隐私模式下写不了，无所谓 */
				}
				return entries;
			}

			function matches(entry, needle) {
				if (!needle) return true;
				return [entry.id, entry.name, entry.description, entry.author, entry.repo, ...(entry.tags ?? [])].some((value) => typeof value === "string" && value.toLowerCase().includes(needle));
			}

			function permText(entry) {
				const list = entry.permissions ?? [];
				if (!list.length) return "不需要权限";
				if (list.length === 1) return `需要 ${list[0]}`;
				return `需要 ${list[0]} 等 ${list.length} 项权限`;
			}

			function entryNode(entry) {
				const item = document.createElement("article");
				item.className = "entry";

				const head = document.createElement("div");
				head.className = "e-head";
				const url = installUrl(entry);
				const name = document.createElement("a");
				name.className = "e-name";
				name.href = url;
				name.target = "_blank";
				name.rel = "noreferrer noopener";
				name.textContent = entry.name ?? entry.id;
				name.title = entry.id;
				const ver = document.createElement("span");
				ver.className = "e-ver";
				ver.textContent = entry.version ?? "";
				head.append(mark(entry.icon), name, ver);

				const desc = document.createElement("p");
				desc.className = "e-desc";
				desc.textContent = entry.description ?? "";

				const foot = document.createElement("div");
				foot.className = "e-foot";
				const perm = document.createElement("span");
				perm.className = "e-perm";
				perm.textContent = permText(entry);
				perm.title = (entry.permissions ?? []).join("\n") || "不需要任何权限";
				const kind = KINDS[entry.presentations?.[0]];
				const copy = document.createElement("button");
				copy.type = "button";
				copy.className = "e-copy";
				copy.textContent = "复制链接";
				copy.title = "复制安装链接";
				copy.addEventListener("click", async () => {
					try {
						await navigator.clipboard.writeText(url);
						copy.dataset.state = "done";
						copy.textContent = "已复制";
						setTimeout(() => {
							delete copy.dataset.state;
							copy.textContent = "复制链接";
						}, 1600);
					} catch {
						copy.dataset.state = "failed";
						copy.textContent = "复制失败";
					}
				});
				foot.append(perm);
				if (kind) {
					const kindEl = document.createElement("span");
					kindEl.className = "e-kind";
					kindEl.textContent = kind;
					foot.append(kindEl);
				}
				foot.append(copy);

				item.append(head, desc, foot);
				return item;
			}

			function group(key, title, note, entries) {
				const section = document.createElement("section");
				section.className = "group";
				const head = document.createElement("div");
				head.className = "group-head";
				const heading = document.createElement("h2");
				heading.textContent = title;
				const noteEl = document.createElement("span");
				noteEl.className = "group-note";
				noteEl.textContent = note;
				if (key === "github") noteEl.dataset.warn = "";
				const count = document.createElement("span");
				count.className = "group-count";
				count.textContent = String(entries.length);
				head.append(heading, noteEl, count);
				const list = document.createElement("div");
				list.className = "entries";
				list.append(...entries.map(entryNode));
				section.append(head, list);
				return section;
			}

			function skeleton() {
				const section = document.createElement("section");
				section.className = "group skeleton";
				const list = document.createElement("div");
				list.className = "entries";
				for (let i = 0; i < 8; i += 1) {
					const item = document.createElement("article");
					item.className = "entry";
					const a = document.createElement("div");
					a.className = "sk";
					a.style.width = "38%";
					const b = document.createElement("div");
					b.className = "sk";
					b.style.width = "88%";
					b.style.marginTop = "10px";
					const c = document.createElement("div");
					c.className = "sk";
					c.style.width = "26%";
					c.style.marginTop = "10px";
					item.append(a, b, c);
					list.append(item);
				}
				section.append(list);
				return section;
			}

			function renderNotice() {
				const notice = el("notice");
				if (!state.errors.length) {
					notice.hidden = true;
					notice.replaceChildren();
					return;
				}
				notice.hidden = false;
				const text = document.createElement("span");
				const strong = document.createElement("strong");
				strong.textContent = "部分来源加载失败。";
				text.append(strong, document.createTextNode(` ${state.errors.join("；")}`));
				const retry = document.createElement("button");
				retry.type = "button";
				retry.textContent = "重试";
				retry.addEventListener("click", load);
				notice.replaceChildren(text, retry);
			}

			function render() {
				const needle = state.query.trim().toLowerCase();
				const registry = state.registry.filter((entry) => matches(entry, needle));
				const github = state.github.filter((entry) => matches(entry, needle));
				const showRegistry = state.source === "github" ? [] : registry;
				const showGithub = state.source === "registry" ? [] : github;
				const total = showRegistry.length + showGithub.length;

				for (const node of document.querySelectorAll("[data-count]")) {
					const key = node.dataset.count;
					node.textContent = String(key === "all" ? registry.length + github.length : key === "registry" ? registry.length : github.length);
				}

				const results = el("results");
				results.replaceChildren();
				el("empty").hidden = true;

				if (state.loading) {
					results.append(skeleton());
					el("status").textContent = "加载中…";
					renderNotice();
					return;
				}

				const nothingLoaded = state.errors.length > 0 && state.registry.length === 0 && state.github.length === 0;
				if (total === 0 && !nothingLoaded) {
					el("empty").hidden = false;
					el("empty-title").textContent = state.query.trim() ? `没有匹配「${state.query.trim()}」的插件` : "这个来源下还没有插件";
					el("empty-hint").textContent = state.query.trim() ? "换个关键词试试，或者切回全部来源。" : "给仓库打上 pideck-plugin topic，它就会出现在这里。";
					el("clear").hidden = !state.query.trim();
					el("show-all").hidden = state.source === "all";
				} else {
					if (showRegistry.length) results.append(group("registry", "官方收录", "人工核对过 manifest 与权限", showRegistry));
					if (showGithub.length) results.append(group("github", "社区 · 未审阅", "GitHub topic 自动抓取，PiDeck 不背书", showGithub));
				}

				const filtering = Boolean(state.query.trim()) || state.source !== "all";
				el("status").textContent = filtering ? `匹配 ${total} 个` : `${state.registry.length} 个官方收录，${state.github.length} 个社区条目`;
				renderNotice();
			}

			for (const button of document.querySelectorAll("[data-source]")) {
				button.addEventListener("click", () => {
					state.source = button.dataset.source;
					for (const other of document.querySelectorAll("[data-source]")) other.setAttribute("aria-pressed", String(other === button));
					render();
				});
			}
			el("query").addEventListener("input", (event) => {
				state.query = event.target.value;
				render();
			});
			el("clear").addEventListener("click", () => {
				state.query = "";
				el("query").value = "";
				el("query").focus();
				render();
			});
			el("show-all").addEventListener("click", () => {
				state.source = "all";
				for (const other of document.querySelectorAll("[data-source]")) other.setAttribute("aria-pressed", String(other.dataset.source === "all"));
				render();
			});
			document.addEventListener("keydown", (event) => {
				const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? "");
				if (event.key === "/" && !typing) {
					event.preventDefault();
					el("query").focus();
				} else if (event.key === "Escape" && document.activeElement === el("query")) {
					state.query = "";
					el("query").value = "";
					el("query").blur();
					render();
				}
			});

			async function load() {
				state.loading = true;
				state.errors = [];
				render();
				const [registry, github] = await Promise.allSettled([loadRegistry(), loadGitHub()]);
				state.loading = false;
				if (registry.status === "fulfilled") state.registry = (registry.value.plugins ?? []).map((entry) => ({ ...entry, source: "registry" }));
				else state.errors.push(`收录表加载失败：${registry.reason?.message ?? registry.reason}`);
				if (github.status === "fulfilled") state.github = github.value;
				else state.errors.push(`社区来源加载失败：${github.reason?.message ?? github.reason}`);
				render();
			}

			render();
			load();
		</script>
	</body>
</html>
